<!-- FILENAME: index.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chu-Do List</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    </head>

    <body>
        <!-- overlay backdrop for sidebar -->
        <div id="sidebar-overlay" class="sidebar-overlay hidden"></div>

        <!-- sliding sidebar nav -->
        <aside id="sidebar" class="sidebar hidden">

            <div class="sidebar-header">
                <h2>Lists</h2>
                <button id="close-sidebar-btn" class="icon-btn">
                    &times;
                </button>
            </div>

            <nav class="sidebar-nav">
                <!-- personal tasks -->
                <div class="nav-section">
                    <button id="nav-personal-btn" class="nav-item active" data-list-id="personal">
                        Personal Tasks
                    </button>
                </div>

                <hr class="nav-divider">

                <!-- collaborative lists category -->
                <div class="nav-section">
                    <div class="section-title-row">
                        <span class="section-title">Collaborative Lists</span>
                        <button id="open-create-list-modal-btn" class="add-list-btn" title="Create New List">+</button>
                    </div>

                    <ul id="collab-lists-nav" class="collab-lists-list">
                        <!-- contents rendered via JS injection -->
                    </ul>
                </div>
            </nav>

            <div class="sidebar-footer">
                <a href="{{ url_for('get_profile') }}" class="sidebar-link">Profile Settings</a>
                <button id="logout-btn" class="logout-btn">Log Out</button>
            </div>
        </aside>



        <!-- main page container -->
        <main class="container">
            <!-- header + task creation card -->
            <div class="add-task-card">
                <!-- title + add task btn -->
                <header class="app-header">
                    <div class="header-left">
                        <button id="toggle-sidebar-btn" class="icon-btn" title="Open Lists Menu">☰</button>
                        <h1 id="active-list-title">Personal Tasks</h1>
                    </div>
                    <button id="add-task-btn" type="button">+</button>
                </header>
                

                <!-- collaboration controls (visible only when a collab list selected) -->
                <!----------------------------------------------------------------------->
                <div id="collab-header-controls" class="collab-controls-bar hidden">
                    <div class="add-member-inline">
                        <input type="email" id="member-email-input" placeholder="Add collaborator by email...">
                        <button id="add-member-btn" type="submit">Add</button>
                    </div>
                    <p id="member-feedback" class="form-feedback hidden"></p>
                </div>
                
                
                <!-- task creation section -->
                <!-------------------------------------------------------------->
                <section class="task-form-section hidden" id="task-form-section">
                    <hr class="section-divider">
                    <div class="task-form-header">
                        <h2 id="form-header">Create a Task</h2>
                    </div>

                    <!-- form for task creation -->
                    <form id="task-form">
                        
                        <!-- takes task name and due date input -->
                        <p>Task</p>
                        <input type="text" id="task-name" name="task" placeholder="What are we up to?" required>
                        
                        <p>Deadline</p>
                        <input type="datetime-local" id="due-date-time" name="dueDateTime">
                        
                        <!-- values are numbers to match constants in JS -->
                        <p>Priority</p>
                        <select id="priority-select" name="prioritySelect">
                            <option value="1">High</option>
                            <option value="2">Medium</option>
                            <option value="3">Low</option>
                        </select>

                        <!-- note: below are default tags, user can create new ones -->
                        <p>Tag</p>
                        <select id="tag" name="tag">
                            <option value="none" selected>No tag</option>
                            <option value="academic">Academic</option>
                            <option value="personal">Personal</option>
                        </select>

                        <br>
                        <button type="submit" id="submit-btn">Add Task</button>
                    </form>
                </section>
            </div>
            
            <!-- task list section -->
            <section class="task-list-section">
                <div id="task-list-section-header-container">
                    <h2>Your Tasks</h2>
                    <div id="task-list-sort-filter-container">
                        <div id="task-list-sort-container" class="sort-filter-elem">
                            <label for="sort-task-list" id="sort-label">Sort by:</label>
                            <select name="" id="sort-task-list">
                                <option value="priority">Priority</option>
                                <option value="due-date">Due Date</option>
                                <option value="date-added">Date Added</option>
                            </select>
                        </div>
                        
                        <fieldset id="task-list-filter-container" class="sort-filter-elem">
                            <legend id="filter-label">Filter by tag:</legend>
                            <label><input type="checkbox" name="filter-tag" value="academic">Academic</label>
                            <label><input type="checkbox" name="filter-tag" value="personal">Personal</label>
                            <label><input type="checkbox" name="filter-tag" value="none">No tag</label>
                        </fieldset>
                    </div>
                </div>
                <ul id="task-list">
                    <!-- tasks are injected via JS -->
                </ul>
            </section>

        </main>


        <div id="create-list-modal" class="modal-backdrop hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h2>Create New List</h2>
                    <button id="close-list-modal-btn">&times;</button>
                </div>

                <form id="create-list-form">
                    <p>List Title</p>
                    <input type="text" id="new-list-name" placeholder="e.g. Group Project" required>
                    <p id="create-list-error" class="form-error hidden"></p>
                    <button type="submit" class="submit-modal-btn">Create List</button>
                </form>
            </div>
        </div>

        
        <footer>
            © 2026 chuhchi-org
        </footer>
        
        <!-- JS scripts -->
        <script src="{{ url_for('static', filename='js/task.js') }}"></script>
        <script src="{{ url_for('static', filename='js/tasksRender.js') }}"></script>
        <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
        <script src="{{ url_for('static', filename='js/collab.js') }}"></script>
        <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    </body>
</html>
