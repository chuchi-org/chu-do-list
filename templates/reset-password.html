<!-- FILENAME: reset-password.html -->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chu-Do List | Reset Password</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot-password.css') }}">
    </head>
    
    <body>
        <main>
            <div id="forgot-password-container">
                <h2>Reset Password</h2>
                
                <form id="reset-password-form">
                    <div>
                        <input type="text" id="reset-pass-code" autocomplete="off" placeholder="Enter Reset code" required>
                    </div>
    
                    <div>
                        <p>New Password</p>
                        <input type="password" id="reset-pass-new"         minlength="8" autocomplete="new-password" placeholder="New Password"         required>
                        <input type="password" id="reset-pass-new-confirm" minlength="8" autocomplete="new-password" placeholder="Confirm New Password" required>
                    </div>
    
                    <button type="submit">Reset Password</button>
                </form>
                
                <p id="reset-pass-message"></p>
                <a href="{{ url_for('login') }}">Back to Login</a>
            </div>
        </main>

        <script src="{{ url_for('static', filename='js/resetPassword.js') }}"></script>
    </body>
</html>
